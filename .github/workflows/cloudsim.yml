name: CloudSim CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Create build directory
      run: mkdir -p build
    
    - name: Compile Java code
      run: |
        javac -d build -cp "jars/cloudsim-3.0.3.jar:jars/cloudsim-examples-3.0.3.jar" examples/org/cloudbus/cloudsim/examples/*.java
    
    - name: Run CloudSimExample2
      run: |
        java -cp "build:jars/cloudsim-3.0.3.jar:jars/cloudsim-examples-3.0.3.jar" org.cloudbus.cloudsim.examples.CloudSimExample2
      
    - name: Archive build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: CloudSim-classes
        path: build/**/*.class
